<!DOCTYPE html>
<html>
<head>
  <title>Share Location</title>
</head>
<body>
  <h2>Click below to share your location</h2>
  <button onclick="getLocation()">Share Location</button>

  <p id="status"></p>

  <script>
    function getLocation() {
      if (!navigator.geolocation) {
        document.getElementById("status").innerText = "Geolocation not supported.";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        function(position) {
          fetch("https://formspree.io/f/xlgwbqka", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy
            })
          });

          document.getElementById("status").innerText = "Location sent successfully.";
        },
        function() {
          document.getElementById("status").innerText = "Permission denied.";
        },
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
